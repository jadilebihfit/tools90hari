<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>LEBIHFIT</title>
<meta name="claude:viewport-fit-sides" content="cover">
<meta name="theme-color" content="#0b0c0a">
<meta name="description" content="Checklist diet, log makanan warteg & mall, dan tracker latihan. Data tersimpan di device kamu.">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Anton&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap">
<style>
/* Layout: satu kolom ala aplikasi HP (maks 480px), bottom nav tetap, sheet dari bawah untuk detail.
   Sengaja satu tema gelap mengikuti referensi UI user. */
:root{
  --bg:#0b0c0a; --surface:#151713; --surface-2:#1d2019; --line:#2a2e24;
  --fg:#f1f4ea; --muted:#8e9585; --dim:#5d6356;
  --lime:#cdf33a; --lime-2:#a8d41c; --lime-ink:#11140a;
  --red:#ff6b5b; --amber:#ffb547; --sky:#6cc6ff;
  --display:"Anton","Impact","Arial Narrow",sans-serif;
  --body:"Plus Jakarta Sans",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --r-lg:26px; --r-md:18px; --r-sm:12px;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--fg);font-family:var(--body);font-size:15px;line-height:1.45;-webkit-font-smoothing:antialiased;-webkit-tap-highlight-color:transparent}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);background:var(--bg);z-index:30}
[hidden]{display:none!important}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;border:0;background:none;padding:0}
button:disabled{opacity:.35;cursor:default}
:focus-visible{outline:2px solid var(--lime);outline-offset:2px}
.num{font-variant-numeric:tabular-nums}
h1,h2,h3{margin:0;text-wrap:balance}
p{margin:0}
#app{max-width:480px;margin:0 auto;min-height:100%;position:relative;padding-left:max(18px,env(safe-area-inset-left,0px));padding-right:max(18px,env(safe-area-inset-right,0px))}
.screen{padding-block:18px 120px;display:flex;flex-direction:column;gap:22px}
.muted{color:var(--muted)}
.small{font-size:13px}
.tiny{font-size:11.5px}
.row{display:flex;align-items:center;gap:10px}
.between{justify-content:space-between}
.grow{flex:1;min-width:0}
.ic{width:22px;height:22px;flex:none}
.ic-sm{width:18px;height:18px;flex:none}

/* buttons */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:10px;height:52px;padding:0 24px;border-radius:999px;font-weight:700;font-size:15px;text-decoration:none;transition:transform .12s ease,background .2s}
.btn:active{transform:scale(.97)}
.btn-lime{background:var(--lime);color:var(--lime-ink)}
.btn-dark{background:var(--lime-ink);color:var(--fg)}
.btn-ghost{background:var(--surface-2);color:var(--fg)}
.btn-line{border:1px solid var(--line);color:var(--fg)}
.btn-danger{background:transparent;border:1px solid #5a2a24;color:var(--red)}
.btn-block{width:100%}
.btn-sm{height:38px;padding:0 16px;font-size:13.5px}
.icon-btn{width:44px;height:44px;border-radius:50%;display:grid;place-items:center;background:var(--surface-2);flex:none}
.icon-btn.lime{background:var(--lime);color:var(--lime-ink)}
.link{color:var(--lime);font-weight:600;font-size:13.5px}

/* cards */
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-lg);padding:18px}
.card-title{font-weight:700;font-size:16px}
.section-head{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:12px}
.section-head h3{font-size:17px;font-weight:700}

/* gate */
.brand{display:inline-flex;align-items:center;gap:10px}
.brand svg{border-radius:28%}
.brand .wm{font-family:var(--display);letter-spacing:1.2px;line-height:1;color:var(--fg)}
.brand .wm em{font-style:normal;color:var(--lime)}
.gate{min-height:100vh;min-height:100dvh;display:flex;flex-direction:column;padding-block:22px 32px;gap:24px}
.gate-hero{position:relative;display:flex;flex-direction:column}
.display{font-family:var(--display);font-weight:400;text-transform:uppercase;letter-spacing:.5px;line-height:.98}
.gate h1{font-size:clamp(40px,12vw,56px);position:relative}
.gate h1 span{color:var(--lime)}
.pv-wrap{position:relative}
.pv-wrap::before{content:"";position:absolute;left:50%;top:46%;width:360px;height:360px;max-width:100%;transform:translate(-50%,-50%);background:radial-gradient(closest-side,rgba(205,243,58,.22),transparent);pointer-events:none}
.pv-strip{position:relative;display:flex;gap:14px;overflow-x:auto;scroll-snap-type:x mandatory;margin-inline:-18px;padding:4px 18px 6px;scrollbar-width:none}
.pv-strip::-webkit-scrollbar{display:none}
.pv{margin:0;flex:0 0 auto;scroll-snap-align:center;display:flex;flex-direction:column;align-items:center;gap:10px}
.pv figcaption{font-size:12.5px;font-weight:600;color:var(--muted)}
.pv-phone{width:234px;height:470px;border-radius:36px;border:6px solid #262b20;background:var(--bg);overflow:hidden;position:relative;box-shadow:0 30px 60px -32px rgba(205,243,58,.45)}
.pv-inner{width:390px;height:805px;transform:scale(.5692);transform-origin:0 0;position:relative;padding:8px 18px 0;overflow:hidden;pointer-events:none;user-select:none}
.pv-inner .nav{position:absolute}
.yt{position:relative;flex:none;width:100%;aspect-ratio:16/9;border-radius:18px;overflow:hidden;background:#000;border:1px solid var(--line)}
.yt iframe{position:absolute;inset:0;width:100%;height:100%;border:0}
.yt-links{display:flex;gap:10px;flex-wrap:wrap}
.yt-links a{font-size:13px;color:var(--muted);text-decoration:underline;text-underline-offset:3px}
.tag.vid{background:var(--lime);color:var(--lime-ink);text-transform:none}
.tut-media{width:100%;max-width:260px;aspect-ratio:1;margin:0 auto;border-radius:22px;overflow:hidden;background:#fff}
.tut-media video{width:100%;height:100%;object-fit:contain;display:block}
.item .thumb img{width:100%;height:100%;object-fit:cover;border-radius:14px;background:#fff}
.gate-sub{color:var(--muted);font-size:16px;margin-top:14px;position:relative}
.choice{display:flex;align-items:center;gap:14px;width:100%;text-align:left;padding:18px;border-radius:var(--r-md);background:var(--surface);border:1px solid var(--line)}
.choice.primary{background:var(--lime);color:var(--lime-ink);border-color:var(--lime)}
.choice .ci{width:46px;height:46px;border-radius:14px;display:grid;place-items:center;background:var(--surface-2);flex:none}
.choice.primary .ci{background:rgba(17,20,10,.12)}
.choice b{display:block;font-size:16px}
.choice small{display:block;opacity:.72;font-size:13px}
.privacy{display:flex;gap:10px;align-items:flex-start;color:var(--muted);font-size:12.5px}

/* onboarding */
.steps{display:flex;gap:6px}
.steps i{flex:1;height:4px;border-radius:4px;background:var(--surface-2)}
.steps i.on{background:var(--lime)}
.onb-title{font-family:var(--display);text-transform:uppercase;font-size:34px;line-height:1.02;letter-spacing:.3px}
.field{display:flex;flex-direction:column;gap:7px}
.field label{font-size:13px;color:var(--muted);font-weight:600}
.input{height:52px;border-radius:var(--r-sm);background:var(--surface);border:1px solid var(--line);padding:0 16px;width:100%;font-size:16px}
.input:focus{border-color:var(--lime);outline:none}
textarea.input{height:auto;padding:12px 16px;min-height:110px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.seg{display:flex;background:var(--surface);border:1px solid var(--line);border-radius:999px;padding:4px;gap:4px}
.seg button{flex:1;height:40px;border-radius:999px;font-weight:600;font-size:14px;color:var(--muted)}
.seg button.on{background:var(--lime);color:var(--lime-ink)}
.opt{display:flex;gap:14px;align-items:center;text-align:left;width:100%;padding:16px;border-radius:var(--r-md);background:var(--surface);border:1.5px solid var(--line)}
.opt.on{border-color:var(--lime);background:#1a1f10}
.opt .dot{width:22px;height:22px;border-radius:50%;border:2px solid var(--dim);flex:none;display:grid;place-items:center}
.opt.on .dot{border-color:var(--lime);background:var(--lime)}
.opt.on .dot::after{content:"";width:8px;height:8px;border-radius:50%;background:var(--lime-ink)}
.opt b{display:block;font-size:15px}
.opt small{display:block;color:var(--muted);font-size:12.5px;margin-top:2px}
.opt-list{display:flex;flex-direction:column;gap:10px}
.onb-foot{position:sticky;bottom:0;padding-block:14px max(14px,env(safe-area-inset-bottom,0px));background:linear-gradient(transparent,var(--bg) 30%);display:flex;gap:10px}
.big-stat{display:flex;flex-direction:column;align-items:center;gap:4px;padding:26px 18px;border-radius:var(--r-lg);background:var(--lime);color:var(--lime-ink);text-align:center}
.big-stat .v{font-family:var(--display);font-size:64px;line-height:1}
.kv{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.kv div{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-md);padding:14px 10px;text-align:center}
.kv b{display:block;font-size:20px}
.kv span{font-size:12px;color:var(--muted)}
.day-row{display:flex;align-items:center;gap:12px;padding:12px 14px;background:var(--surface);border:1px solid var(--line);border-radius:var(--r-sm)}
.day-row .d{width:38px;font-weight:800;color:var(--lime);font-size:13px}
.day-row select{flex:1;min-width:0;background:var(--surface-2);border:1px solid var(--line);border-radius:10px;height:40px;padding:0 10px}

/* header */
.top{display:flex;align-items:center;justify-content:space-between;gap:12px}
.hello h1{font-size:25px;font-weight:800;letter-spacing:-.3px}
.hello p{color:var(--muted);margin-top:4px}
.page-title{font-size:22px;font-weight:800;letter-spacing:-.2px}

/* hero workout card */
.wo-scroll{display:flex;gap:14px;overflow-x:auto;scroll-snap-type:x mandatory;margin-inline:-18px;padding-inline:18px;scrollbar-width:none}
.wo-scroll::-webkit-scrollbar{display:none}
.wo-card{flex:0 0 84%;scroll-snap-align:start;border-radius:var(--r-lg);padding:22px;position:relative;min-height:236px;display:flex;flex-direction:column}
.wo-card.lime{background:linear-gradient(150deg,#d9fb54 0%,var(--lime) 45%,#b4e01f 100%);color:var(--lime-ink);box-shadow:0 18px 40px -18px rgba(205,243,58,.55)}
.wo-card.dark{background:var(--surface);border:1px solid var(--line)}
.wo-card .lbl{font-size:13px;font-weight:600;opacity:.75}
.wo-card h2{font-size:25px;font-weight:800;line-height:1.12;margin-top:6px;max-width:75%}
.wo-card .meta{margin-top:auto;display:flex;flex-direction:column;gap:4px;font-size:14px;font-weight:500;padding-top:16px}
.wo-card .badge{position:absolute;top:18px;right:18px;width:52px;height:52px;border-radius:50%;background:rgba(255,255,255,.55);display:grid;place-items:center}
.wo-card.dark .badge{background:var(--surface-2)}
.wo-card .btn{margin-top:16px;align-self:flex-start}

/* stats trio */
.trio{display:grid;grid-template-columns:repeat(3,1fr)}
.trio>div{display:flex;flex-direction:column;align-items:center;gap:4px;text-align:center;padding:4px 6px}
.trio>div+div{border-left:1px solid var(--line)}
.trio .ic{color:var(--lime)}
.trio span{font-size:12px;color:var(--muted)}
.trio b{font-size:21px;font-weight:700}
.trio small{font-size:11px;color:var(--dim)}

/* ring */
.ring-wrap{position:relative;display:grid;place-items:center}
.ring-center{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center}
.ring-center b{font-size:38px;font-weight:800;letter-spacing:-1px;line-height:1}
.ring-center span{font-size:13px;color:var(--muted)}
.ring-pill{position:absolute;bottom:-4px;left:50%;transform:translateX(-50%);background:var(--surface-2);border:1px solid var(--line);padding:5px 12px;border-radius:999px;font-size:12px;white-space:nowrap}

/* macro bars */
.macros{display:flex;flex-direction:column;gap:12px}
.bar-l{display:flex;justify-content:space-between;font-size:13px;margin-bottom:6px}
.bar{height:8px;border-radius:8px;background:var(--surface-2);overflow:hidden}
.bar i{display:block;height:100%;border-radius:8px;background:var(--lime);transition:width .4s ease}
.bar.over i{background:var(--amber)}

/* checklist */
.check{display:flex;align-items:center;gap:12px;padding:13px 0;border-bottom:1px solid var(--line);width:100%;text-align:left}
.check:last-child{border-bottom:0}
.box{width:26px;height:26px;border-radius:9px;border:2px solid var(--dim);display:grid;place-items:center;flex:none;transition:.15s}
.check.on .box{background:var(--lime);border-color:var(--lime);color:var(--lime-ink)}
.check.on .t{color:var(--muted);text-decoration:line-through}
.check .auto{font-size:10.5px;color:var(--dim);border:1px solid var(--line);padding:2px 7px;border-radius:999px}

/* water */
.water{display:flex;gap:6px;flex-wrap:wrap}
.water button{width:30px;height:38px;border-radius:8px 8px 12px 12px;border:1.5px solid var(--line);background:var(--surface-2)}
.water button.on{background:var(--sky);border-color:var(--sky)}

/* bottom nav */
.nav{position:fixed;left:0;right:0;bottom:0;z-index:20;background:rgba(17,19,14,.92);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px);padding-left:env(safe-area-inset-left,0px);padding-right:env(safe-area-inset-right,0px)}
.nav-in{max-width:480px;margin:0 auto;display:grid;grid-template-columns:repeat(5,1fr);padding:10px 6px 8px}
.nav button{display:flex;flex-direction:column;align-items:center;gap:4px;font-size:11.5px;color:var(--muted);font-weight:600}
.nav button.on{color:var(--lime)}

/* lists */
.list{display:flex;flex-direction:column;gap:10px}
.item{display:flex;align-items:center;gap:12px;padding:12px;border-radius:var(--r-md);background:var(--surface);border:1px solid var(--line);width:100%;text-align:left}
.item .thumb{width:48px;height:48px;border-radius:14px;background:var(--surface-2);display:grid;place-items:center;flex:none;color:var(--lime)}
.item .name{font-weight:600;font-size:14.5px;line-height:1.3;text-transform:capitalize}
.item .sub{font-size:12.5px;color:var(--muted);margin-top:2px}
.item .kcal{font-weight:700;font-size:14px;text-align:right;white-space:nowrap}
.done-tick{width:30px;height:30px;border-radius:50%;background:var(--lime);color:var(--lime-ink);display:grid;place-items:center;flex:none}
.chips{display:flex;gap:8px;overflow-x:auto;scrollbar-width:none;margin-inline:-18px;padding-inline:18px}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;height:36px;padding:0 15px;border-radius:999px;background:var(--surface);border:1px solid var(--line);font-size:13px;font-weight:600;color:var(--muted);white-space:nowrap}
.chip.on{background:var(--lime);color:var(--lime-ink);border-color:var(--lime)}
.tag{display:inline-block;font-size:11px;padding:3px 8px;border-radius:999px;background:var(--surface-2);color:var(--muted);text-transform:capitalize}
.search{position:relative}
.search .input{padding-left:46px}
.search .ic{position:absolute;left:15px;top:15px;color:var(--muted)}

/* week day strip */
.days{display:grid;grid-template-columns:repeat(7,1fr);gap:6px}
.days button{display:flex;flex-direction:column;align-items:center;gap:3px;padding:10px 0;border-radius:14px;background:var(--surface);border:1px solid var(--line);font-size:11px;color:var(--muted)}
.days button b{font-size:15px;color:var(--fg)}
.days button.on{background:var(--lime);border-color:var(--lime);color:var(--lime-ink)}
.days button.on b{color:var(--lime-ink)}
.days button.today:not(.on){border-color:var(--lime-2)}
.days .pip{width:5px;height:5px;border-radius:50%;background:var(--lime)}
.days button.on .pip{background:var(--lime-ink)}

/* exercise log */
.ex{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-md);padding:14px}
.ex-head{display:flex;gap:12px;align-items:flex-start}
.ex-head .name{font-weight:700;text-transform:capitalize;font-size:15px;line-height:1.3}
.sets{margin-top:12px;display:flex;flex-direction:column;gap:6px}
.set{display:grid;grid-template-columns:30px 1fr 1fr 44px;gap:8px;align-items:center}
.set .n{font-size:12px;color:var(--muted);text-align:center;font-weight:700}
.set input{height:40px;border-radius:10px;background:var(--surface-2);border:1px solid var(--line);text-align:center;width:100%;font-size:15px;min-width:0}
.set input:focus{border-color:var(--lime);outline:none}
.set .ok{height:40px;border-radius:10px;background:var(--surface-2);border:1px solid var(--line);display:grid;place-items:center;color:var(--dim)}
.set .ok.on{background:var(--lime);border-color:var(--lime);color:var(--lime-ink)}
.set-h{display:grid;grid-template-columns:30px 1fr 1fr 44px;gap:8px;font-size:11px;color:var(--dim);text-align:center;font-weight:700;text-transform:uppercase;letter-spacing:.6px}

/* sheet */
.scrim{position:fixed;inset:0;background:rgba(0,0,0,.6);z-index:40;opacity:0;transition:opacity .2s}
.scrim.show{opacity:1}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:41;max-width:480px;margin:0 auto;background:var(--bg);border:1px solid var(--line);border-bottom:0;border-radius:28px 28px 0 0;max-height:92dvh;max-height:92vh;display:flex;flex-direction:column;transform:translateY(100%);transition:transform .25s cubic-bezier(.2,.8,.2,1)}
.sheet.show{transform:none}
.sheet-grip{width:44px;height:5px;border-radius:5px;background:var(--line);margin:10px auto 0;flex:none}
.sheet-head{display:flex;align-items:center;gap:10px;padding:12px max(18px,env(safe-area-inset-right,0px)) 10px max(18px,env(safe-area-inset-left,0px));flex:none}
.sheet-head h3{flex:1;font-size:18px;font-weight:800;min-width:0;text-transform:none}
.sheet-body{overflow-y:auto;padding:4px max(18px,env(safe-area-inset-right,0px)) max(24px,calc(env(safe-area-inset-bottom,0px) + 16px)) max(18px,env(safe-area-inset-left,0px));display:flex;flex-direction:column;gap:16px;-webkit-overflow-scrolling:touch}

.steps-list{margin:0;padding:0;list-style:none;counter-reset:s;display:flex;flex-direction:column;gap:12px}
.steps-list li{counter-increment:s;display:grid;grid-template-columns:30px 1fr;gap:10px;font-size:14.5px}
.steps-list li::before{content:counter(s);width:28px;height:28px;border-radius:50%;background:var(--surface-2);color:var(--lime);display:grid;place-items:center;font-weight:800;font-size:13px}
.muscle{display:flex;flex-wrap:wrap;gap:6px}
.muscle .tag.p{background:var(--lime);color:var(--lime-ink)}

.nut{width:100%;border-collapse:collapse;font-size:14px}
.nut td{padding:9px 0;border-bottom:1px solid var(--line)}
.nut td:nth-child(2),.nut td:nth-child(3){text-align:right;font-variant-numeric:tabular-nums}
.nut td:nth-child(3){color:var(--muted);width:70px}
.nut tr.h td{font-weight:700}
.wk-table{font-size:13px;min-width:300px}
.wk-table td{text-align:right!important;color:var(--fg)!important;width:auto!important;padding:8px 4px}
.wk-table td:first-child{text-align:left!important}
.wk-table thead td{color:var(--muted)!important;font-size:11.5px;font-weight:600}
.stepper{display:flex;align-items:center;gap:12px}
.stepper button{width:44px;height:44px;border-radius:50%;background:var(--surface-2);font-size:22px;font-weight:700}
.stepper b{min-width:56px;text-align:center;font-size:22px}
.macro-pills{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.macro-pills div{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:10px 6px;text-align:center}
.macro-pills b{display:block;font-size:17px}
.macro-pills span{font-size:11px;color:var(--muted)}
.macro-pills div:first-child{background:var(--lime);color:var(--lime-ink);border-color:var(--lime)}
.macro-pills div:first-child span{color:var(--lime-ink);opacity:.7}

.meal-h{display:flex;justify-content:space-between;align-items:center;margin:4px 2px 8px}
.meal-h b{font-size:15px}
.empty{padding:22px;text-align:center;border:1.5px dashed var(--line);border-radius:var(--r-md);color:var(--muted);font-size:13.5px}

.chart{width:100%;height:auto;display:block}
.chart text{fill:var(--muted);font-size:10px;font-family:var(--body)}
.legend{display:flex;gap:14px;font-size:12px;color:var(--muted);flex-wrap:wrap}
.legend i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:6px;vertical-align:-1px}

.toast{position:fixed;left:50%;bottom:calc(96px + env(safe-area-inset-bottom,0px));transform:translate(-50%,20px);background:var(--lime);color:var(--lime-ink);font-weight:700;padding:12px 20px;border-radius:999px;z-index:60;opacity:0;pointer-events:none;transition:.25s;font-size:14px;max-width:90vw;text-align:center}
.toast.show{opacity:1;transform:translate(-50%,0)}
.note{font-size:12px;color:var(--dim);line-height:1.5}
.settings-row{display:flex;align-items:center;gap:14px;padding:15px 0;border-bottom:1px solid var(--line);width:100%;text-align:left}
.settings-row:last-child{border-bottom:0}
.settings-row .ci{width:40px;height:40px;border-radius:12px;background:var(--surface-2);display:grid;place-items:center;color:var(--lime);flex:none}
.avatar{width:64px;height:64px;border-radius:50%;background:var(--lime);color:var(--lime-ink);display:grid;place-items:center;font-family:var(--display);font-size:30px;flex:none}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
@media (min-width:560px){#app{padding-top:10px}}
</style>
</head>
<body>
<div id="app"></div>
<div class="toast" id="toast" role="status" aria-live="polite"></div>
<script src="data/foods.js"></script>
<script src="data/videos.js"></script>
<script src="app.js"></script>
</body>
</html>
